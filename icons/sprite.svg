<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Линейные иконки сайта. Подключение: <svg class="icon"><use href="icons/sprite.svg#id"></use></svg> -->

  <symbol id="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 3.5h3.2l1.6 4.2-2.1 1.4a11.5 11.5 0 0 0 7.2 7.2l1.4-2.1 4.2 1.6V19a1.8 1.8 0 0 1-1.9 1.8C10.5 20.3 3.7 13.5 3.2 5.4A1.8 1.8 0 0 1 5 3.5Z"/>
  </symbol>

  <symbol id="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
