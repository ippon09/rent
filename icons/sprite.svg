    <path d="M19 3H8a2 2 0 0 0-2 2v22a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V10l-7-7Z"/>
    <path d="M19 3v7h7M11 15h10M11 19h10M11 23h5"/>
