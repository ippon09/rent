    <path d="M9 23h3M15 23h3M21 23h3"/>
  </symbol>

  <symbol id="stone" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
